name: Camera Thread Split Apply Once

on:
  push:
    branches:
      - step12-status-sync
    paths:
      - scripts/apply_camera_thread_split.py
      - .github/workflows/camera-thread-split-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: step12-status-sync
          fetch-depth: 0

      - name: Apply camera thread split
        run: python scripts/apply_camera_thread_split.py

      - name: Verify expected diff
        run: |
          git diff --check
          git diff -- src/execution_control/Executive.cpp src/execution_control/Executive.hpp
          grep -q '\[CAMERA_THREAD_SPLIT_V1\]' src/execution_control/Executive.cpp
          grep -q 'scheduler_diagnostics_.camera = local_camera_diagnostics' src/execution_control/Executive.cpp
          ! sed -n '/void Executive::run()/,/void Executive::stop()/p' src/execution_control/Executive.cpp | grep -q 'runPeriodicTask(scheduler_.camera'

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/execution_control/Executive.cpp src/execution_control/Executive.hpp
          git commit -m 'feat(camera): isolate capture from perception loop'
          git push origin HEAD:step12-status-sync
