name: Apply Control Thread Split Once

on:
  push:
    branches:
      - step12-status-sync
    paths:
      - .control-thread-split-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-control-thread-split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: step12-status-sync
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python scripts/apply_control_thread_split.py

      - name: Show diff
        run: git diff --check && git diff -- src/execution_control/Executive.hpp src/execution_control/Executive.cpp .github/workflows/scheduler-audit-tests.yml

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/execution_control/Executive.hpp src/execution_control/Executive.cpp .github/workflows/scheduler-audit-tests.yml
          git commit -m "feat(control): isolate 20ms control from vision loop"
          git push origin HEAD:step12-status-sync
