name: Full Footprint Kernel Perf Once

on:
  push:
    branches:
      - step12-status-sync
    paths:
      - .github/workflows/full-footprint-kernel-perf-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: step12-status-sync
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact kernel optimization
        run: python apply_full_footprint_kernel_perf.py
      - name: Install dependency
        run: python -m pip install PyYAML
      - name: Run focused tests and profile
        run: |
          python -m compileall -q server_v1
          cd server_v1
          python -m unittest discover -s tests -p 'test_full_footprint_collision.py' -v
          python - <<'PY'
          import time
          from pathlib import Path
          from hybrid_astar_v1 import HybridAStarPlanner, Pose, build_slot_obstacles, load_yaml
          from slot_selector_v1 import rear_axle_goal_for_slot
          root=Path('.')
          m=load_yaml(root/'map_v1.yaml'); v=load_yaml(root/'vehicle_v1.yaml'); c=load_yaml(root/'planner_v1.yaml')
          t=time.perf_counter(); p=HybridAStarPlanner(m,v,c); init=(time.perf_counter()-t)*1000
          states={'P_B1':'OCCUPIED','P_B2':'FREE','P_T1':'OCCUPIED','P_T2':'OCCUPIED'}
          slot=next(s for s in m['slots'] if s['id']=='P_B2')
          goal,_,_=rear_axle_goal_for_slot(slot,v)
          obs=build_slot_obstacles(m,states,target_slot='P_B2')
          t=time.perf_counter(); r=p.plan(Pose(1.300,0.751,0.0),goal,obs); elapsed=(time.perf_counter()-t)*1000
          print(f'[PROFILE2] init_ms={init:.2f} plan_ms={elapsed:.2f} success={r.success} reason={r.reason} expansions={r.expansions} nodes={len(r.path)}')
          PY
      - name: Commit optimized planner
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server_v1/hybrid_astar_v1.py
          git commit -m 'perf(parking): optimize exact footprint collision kernel'
          git push origin HEAD:step12-status-sync
