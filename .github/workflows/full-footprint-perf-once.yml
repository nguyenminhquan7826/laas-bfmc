name: Full Footprint Perf Once

on:
  push:
    branches:
      - step12-status-sync
    paths:
      - .github/workflows/full-footprint-perf-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: step12-status-sync

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply safe broad-phase optimization
        run: python apply_full_footprint_perf.py

      - name: Install planner dependency
        run: python -m pip install PyYAML

      - name: Compile and run focused footprint tests
        run: |
          python -m compileall -q server_v1
          cd server_v1
          python -m unittest discover -s tests -p 'test_full_footprint_collision.py' -v

      - name: Commit optimized planner
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server_v1/hybrid_astar_v1.py
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'perf(parking): accelerate full-footprint CAD collision'
          git push origin HEAD:step12-status-sync
