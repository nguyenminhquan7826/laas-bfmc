name: Full Footprint Validation Once

on:
  push:
    branches:
      - step12-status-sync
    paths:
      - .github/workflows/full-footprint-validation-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: step12-status-sync
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply validation patch
        run: python apply_full_footprint_server_validation.py
      - name: Install dependency
        run: python -m pip install PyYAML
      - name: Run Python server tests
        run: |
          python -m compileall -q server_v1
          cd server_v1
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit permanent changes
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server_v1/server_stub.py server_v1/map_v1.yaml server_v1/tests/test_full_footprint_server_validation.py
          git commit -m 'fix(parking): enforce footprint in server trajectory validation'
          git push origin HEAD:step12-status-sync
