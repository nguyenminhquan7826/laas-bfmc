name: Perception Cleanup Apply Once

on:
  push:
    branches:
      - step12-status-sync
    paths:
      - scripts/apply_perception_cleanup.py
      - .github/workflows/perception-cleanup-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: step12-status-sync
          fetch-depth: 0

      - name: Apply perception cleanup
        run: python scripts/apply_perception_cleanup.py

      - name: Verify expected diff
        run: |
          git diff --check
          grep -q 'LAAS_PARKING_BENCH_DEBUG' src/app/main.cpp
          grep -q 'enable_debug_stream' src/laas_core/Config.hpp
          grep -q 'ipm_matrix_' src/functional/perception/LaneDetectorCore.hpp
          grep -q 'perceptionMaxExecUs=' src/execution_control/Executive.cpp
          ! grep -q 'input.frame_bgr.clone()' src/functional/perception/LanePerceptionModule.cpp

      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/laas_core/Config.hpp \
            src/app/main.cpp \
            src/logical_robot/UdpYoloInterface.cpp \
            src/functional/perception/LaneDetectorCore.hpp \
            src/functional/perception/LaneDetectorCore.cpp \
            src/functional/perception/LanePerceptionModule.cpp \
            src/execution_control/Executive.cpp \
            .github/workflows/scheduler-audit-tests.yml
          git commit -m 'perf(perception): remove bench debug overhead and cache IPM'
          git push origin HEAD:step12-status-sync
