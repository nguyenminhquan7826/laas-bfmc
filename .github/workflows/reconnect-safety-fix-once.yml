name: Reconnect Safety Fix Once

on:
  push:
    branches:
      - step12-status-sync
    paths:
      - scripts/apply_reconnect_safety_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: step12-status-sync

      - name: Apply reconnect safety patch
        run: python scripts/apply_reconnect_safety_fix.py

      - name: Build reconnect safety policy regression test
        run: |
          g++ -std=c++14 -Wall -Wextra -Wpedantic \
            -Iserver_v1/tests/cpp_stubs \
            -Isrc \
            server_v1/tests/test_parking_safety_event_sync_policy.cpp \
            -o /tmp/test_parking_safety_event_sync_policy

      - name: Run reconnect safety policy regression test
        run: /tmp/test_parking_safety_event_sync_policy

      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/execution_control/Executive.cpp \
            src/execution_control/Executive.hpp \
            src/logical_robot/ParkingSafetyEventSyncPolicy.hpp \
            server_v1/tests/test_parking_safety_event_sync_policy.cpp
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix(parking): reconcile safety events after reconnect'
          git push origin HEAD:step12-status-sync
