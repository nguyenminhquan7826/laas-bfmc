name: Scheduler Audit Tests

on:
  push:
    branches:
      - step12-status-sync
  pull_request:
    branches:
      - main

jobs:
  scheduler-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build scheduler unit test
        run: |
          g++ -std=c++14 -Wall -Wextra -Wpedantic \
            -Isrc \
            server_v1/tests/test_scheduler.cpp \
            src/execution_control/Scheduler.cpp \
            -o /tmp/test_scheduler

      - name: Run scheduler unit test
        run: /tmp/test_scheduler

      - name: Build jitter diagnostics unit test
        run: |
          g++ -std=c++14 -Wall -Wextra -Wpedantic \
            -Isrc \
            server_v1/tests/test_scheduler_diagnostics.cpp \
            -o /tmp/test_scheduler_diagnostics

      - name: Run jitter diagnostics unit test
        run: /tmp/test_scheduler_diagnostics

      - name: Build main CPU affinity parser test
        run: |
          g++ -std=c++14 -Wall -Wextra -Wpedantic \
            -Isrc \
            server_v1/tests/test_cpu_affinity.cpp \
            -o /tmp/test_cpu_affinity

      - name: Run main CPU affinity parser test
        run: /tmp/test_cpu_affinity

      - name: Run AI CPU affinity tests
        run: python -m unittest -v server_v1.tests.test_ai_cpu_affinity

      - name: Audit Executive scheduler and CPU layout
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('src/execution_control/Executive.cpp').read_text()
          start = text.index('void Executive::run()')
          end = text.index('void Executive::stop()', start)
          run = text[start:end]

          assert run.count('handleKeyboardTick();') == 1, 'keyboard tick must occur exactly once'
          assert 'telemetryTick();' not in run, 'telemetry must follow independent control timing'
          assert 'runPeriodicTask(scheduler_.control' not in run, 'control must not run on cooperative vision loop'
          assert '[SCHEDULER_AUDIT_V1]' in text
          assert '[SCHEDULER_JITTER_MONITOR_V1]' in text
          assert '[CONTROL_THREAD_SPLIT_V1]' in text

          for task in ('camera', 'yolo', 'perception', 'decision', 'planning', 'logging'):
              needle = f'runPeriodicTask(scheduler_.{task}, scheduler_diagnostics_.{task}'
              assert needle in run, f'missing diagnostics for {task}'

          worker_start = text.index('void Executive::controlWorkerLoop()')
          worker_end = text.index('void Executive::setUserRunRequest', worker_start)
          worker = text[worker_start:worker_end]
          assert 'runPeriodicTask(' in worker and 'scheduler_.control' in worker
          assert 'telemetryTick();' in worker
          assert worker.index('parkingNetworkTick();') < worker.index('controlTick();') < worker.index('parkingBenchControlTick();')
          assert 'control_state_mutex_' in worker
          assert 'scheduler_diagnostics_.control = local_control_diagnostics' in worker

          assert 'scheduler_diagnostics_.keyboard' in run
          assert '"[SCHED]"' in text
          assert 'controlThread=1' in text
          assert 'controlMissed=' in text
          assert 'controlMaxLateMs=' in text
          assert 'cameraMaxExecUs=' in text
          assert 'yoloMaxExecUs=' in text
          assert 'joinControlWorker();' in text
          assert 'if (!user_run_request_.load())' in text

          logging_start = text.index('void Executive::loggingTick() const')
          logging = text[logging_start:]
          assert 'std::lock_guard<std::mutex> lock(control_state_mutex_)' in logging
          assert 'std::lock_guard<std::mutex> lock(diagnostics_mutex_)' in logging
          assert 'telemetry_rx_hz = telemetry_rx_hz_;' in logging
          assert 'telemetry_sequence_gaps = telemetry_sequence_gaps_;' in logging
          assert 'parking_session_sync_reason = parking_session_sync_reason_;' in logging

          bench_start = text.index('void Executive::parkingBenchControlTick()')
          bench_end = text.index('void Executive::controlTick()', bench_start)
          bench = '\n'.join(
              line for line in text[bench_start:bench_end].splitlines()
              if not line.lstrip().startswith('//')
          )
          assert 'vehicle_.send' not in bench, 'parking bench must remain NO UART'
          assert 'constexpr bool kActuationAuthorized = false;' in text

          main = Path('src/app/main.cpp').read_text()
          affinity = Path('src/laas_core/CpuAffinity.hpp').read_text()
          ai_launcher = Path('ai/run_ai_affinity.py').read_text()
          ai_detector = Path('ai/best_AI.py').read_text()

          assert 'configureMainCpuAffinity()' in main
          assert 'LAAS_MAIN_CPU' in main
          assert 'affinity OFF by default' in main
          assert 'LAAS_PARKING_BENCH_YOLO' in main
          bench_profile_start = main.index('if (bench_env && std::string(bench_env) == "1")')
          bench_profile_end = main.index('laas::Executive executive(config);', bench_profile_start)
          bench_profile = main[bench_profile_start:bench_profile_end]
          assert 'config.runtime.enable_uart = false;' in bench_profile
          assert 'config.runtime.enable_uart = true;' not in bench_profile
          assert 'config.runtime.enable_yolo_udp = bench_yolo_enabled;' in bench_profile
          assert bench_profile.index('config.runtime.enable_uart = false;') < bench_profile.index('config.runtime.enable_yolo_udp = bench_yolo_enabled;')
          assert '" UART=OFF"' in bench_profile
          assert '" YOLO="' in bench_profile

          assert 'const std::string requested = from_env ? env : "off";' in affinity
          assert 'bool enabled{false};' in affinity
          assert 'int cpu{-1};' in affinity
          assert 'sched_setaffinity' in affinity
          assert 'sched_getaffinity' in affinity

          assert 'configure_ai_affinity()' in ai_launcher
          assert 'LAAS_AI_CPUS' in ai_launcher
          assert 'best_AI.cv2.setNumThreads(1)' in ai_launcher
          assert 'OMP_NUM_THREADS' in ai_launcher
          assert 'OPENBLAS_NUM_THREADS' in ai_launcher
          assert 'options.intra_op_num_threads = 2' in ai_detector
          assert 'options.inter_op_num_threads = 1' in ai_detector

          print('[PASS] threaded 20ms control + safe bench YOLO + affinity policy + NO PARKING UART')
          PY
