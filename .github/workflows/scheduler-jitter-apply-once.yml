name: Scheduler Jitter Apply Once

on:
  push:
    branches:
      - step12-status-sync

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: step12-status-sync
          fetch-depth: 0

      - name: Apply guarded jitter monitor patch
        run: python scripts/apply_scheduler_jitter_monitor.py

      - name: Build diagnostics unit test
        run: |
          g++ -std=c++14 -Wall -Wextra -Wpedantic \
            -Isrc \
            server_v1/tests/test_scheduler_diagnostics.cpp \
            -o /tmp/test_scheduler_diagnostics
          /tmp/test_scheduler_diagnostics

      - name: Safety and structure assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/execution_control/Executive.cpp').read_text()
          assert '[SCHEDULER_JITTER_MONITOR_V1]' in text
          start = text.index('void Executive::run()')
          end = text.index('void Executive::stop()', start)
          run = text[start:end]
          assert 'scheduler_diagnostics_.control' in run
          assert 'scheduler_diagnostics_.camera' in run
          assert 'scheduler_diagnostics_.yolo' in run
          assert run.count('telemetryTick();') == 1
          bench_start = text.index('void Executive::parkingBenchControlTick()')
          bench_end = text.index('void Executive::controlTick()', bench_start)
          bench = '\n'.join(
              line for line in text[bench_start:bench_end].splitlines()
              if not line.lstrip().startswith('//')
          )
          assert 'vehicle_.send' not in bench
          assert '"[SCHED]"' in text
          print('[PASS] jitter monitor structure + NO PARKING UART')
          PY

      - name: Commit Executive integration if needed
        run: |
          git add src/execution_control/Executive.cpp
          if git diff --cached --quiet; then
            echo '[SKIP] jitter monitor already integrated'
            exit 0
          fi
          git config user.name 'scheduler-jitter-ci'
          git config user.email 'scheduler-jitter-ci@users.noreply.github.com'
          git commit -m 'feat(scheduler): instrument runtime jitter and deadlines'
          git push origin HEAD:step12-status-sync
