name: Session Boundary Fix Once

on:
  push:
    branches:
      - step12-status-sync
    paths:
      - 'scripts/apply_session_boundary_fix.py'
      - '.github/workflows/session-boundary-fix-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: step12-status-sync
          fetch-depth: 0

      - name: Apply session-boundary stale RX patch
        run: python scripts/apply_session_boundary_fix.py

      - name: Build ParkingServerClient regression harness
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libjson-c-dev
          g++ -std=c++14 -Wall -Wextra -Wpedantic \
            -include cmath -include cerrno \
            -Iserver_v1/tests/cpp_stubs \
            -Isrc \
            server_v1/tests/test_parking_server_client.cpp \
            src/logical_robot/ParkingServerClient.cpp \
            src/logical_robot/ParkingProtocol.cpp \
            $(pkg-config --cflags --libs json-c) \
            -pthread \
            -o /tmp/test_parking_server_client

      - name: Run stale RX reconnect regression
        run: timeout 20s /tmp/test_parking_server_client

      - name: Audit Executive hard session boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/execution_control/Executive.cpp').read_text()
          start = text.index('void Executive::parkingNetworkTick()')
          end = text.index('void Executive::discardParkingSafetyEventsForTrajectory', start)
          network = text[start:end]
          disconnect = network.index('if (was_connected && !parking_server_connected_)')
          inbox = network.index('while (parking_server_.popMessage(server_message))')
          guard = network.index('if (!parking_server_connected_) {', disconnect)
          assert disconnect < guard < inbox
          assert 'parking_session_sync_hold_ = true;' in network[disconnect:guard]
          assert 'parking_session_sync_reason_ = "SERVER_DISCONNECTED";' in network[disconnect:guard]
          client = Path('src/logical_robot/ParkingServerClient.cpp').read_text()
          assert client.count('rx_messages_.clear();') >= 2
          print('[PASS] disconnected session cannot replay stale decoded messages')
          PY

      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/logical_robot/ParkingServerClient.cpp \
            src/execution_control/Executive.cpp \
            server_v1/tests/test_parking_server_client.cpp
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'fix(parking): purge stale RX across reconnect'
            git push origin HEAD:step12-status-sync
          fi
