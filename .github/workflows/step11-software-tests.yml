name: Parking Software Tests

on:
  push:
    branches:
      - step11-software-tests
      - step12-status-sync
  pull_request:
    branches:
      - main

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install server dependencies
        run: python -m pip install --upgrade pip PyYAML

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run server tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  cpp-client-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install C++ test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libjson-c-dev

      - name: Build ParkingServerClient harness
        run: |
          g++ -std=c++14 -Wall -Wextra -Wpedantic \
            -include cmath -include cerrno \
            -Iserver_v1/tests/cpp_stubs \
            -Isrc \
            server_v1/tests/test_parking_server_client.cpp \
            src/logical_robot/ParkingServerClient.cpp \
            src/logical_robot/ParkingProtocol.cpp \
            $(pkg-config --cflags --libs json-c) \
            -pthread \
            -o /tmp/test_parking_server_client

      - name: Run ParkingServerClient TCP/NDJSON tests
        run: timeout 20s /tmp/test_parking_server_client

  step12-session-sync-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Step 12 session sync policy test
        run: |
          g++ -std=c++14 -Wall -Wextra -Wpedantic \
            -Iserver_v1/tests/cpp_stubs \
            -Isrc \
            server_v1/tests/test_parking_session_sync_policy.cpp \
            -o /tmp/test_parking_session_sync_policy

      - name: Run Step 12 session sync policy test
        run: /tmp/test_parking_session_sync_policy

  parking-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip PyYAML
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libjson-c-dev

      - name: Build C++ end-to-end client
        run: |
          g++ -std=c++14 -Wall -Wextra -Wpedantic \
            -include cmath -include cerrno \
            -Iserver_v1/tests/cpp_stubs \
            -Isrc \
            server_v1/tests/test_parking_end_to_end.cpp \
            src/logical_robot/ParkingServerClient.cpp \
            src/logical_robot/ParkingProtocol.cpp \
            src/functional/safety/ParkingTrajectoryValidator.cpp \
            $(pkg-config --cflags --libs json-c) \
            -pthread \
            -o /tmp/test_parking_end_to_end

      - name: Run C++ client against Python Server V1
        run: |
          set -euo pipefail
          PORT=5055
          python -u server_v1/server_stub.py --host 127.0.0.1 --port "$PORT" \
            > /tmp/server_v1_e2e.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            echo "===== SERVER V1 E2E LOG ====="
            cat /tmp/server_v1_e2e.log || true
          }
          trap cleanup EXIT

          python - <<'PY'
          import socket
          import time

          deadline = time.time() + 10.0
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 5055), timeout=0.25):
                      break
              except OSError:
                  time.sleep(0.05)
          else:
              raise SystemExit("Server V1 did not start on port 5055")
          PY

          timeout 60s /tmp/test_parking_end_to_end "$PORT"
