name: Step12B Integrate Executive Once

on:
  push:
    branches:
      - step12-status-sync

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: step12-status-sync
          fetch-depth: 0

      - name: Apply guarded Step 12B patch
        run: python scripts/apply_step12b.py

      - name: Safety assertions
        run: |
          grep -q 'sendSessionQuery' src/execution_control/Executive.cpp
          grep -q 'ParkingSessionSyncPolicy::evaluate' src/execution_control/Executive.cpp
          grep -q 'kActuationAuthorized = false' src/execution_control/Executive.cpp
          if sed -n '/void Executive::parkingBenchControlTick()/,/^}/p' src/execution_control/Executive.cpp \
             | grep -v '^[[:space:]]*//' \
             | grep -q 'vehicle_\.send'; then
            echo '[FAIL] parkingBenchControlTick contains UART send'
            exit 1
          fi
          echo '[PASS] Step12B patch preserves NO PARKING UART'

      - name: Commit integrated source if changed
        run: |
          if git diff --quiet -- src/execution_control/Executive.cpp; then
            echo '[SKIP] no Executive.cpp changes to commit'
            exit 0
          fi
          git config user.name 'step12-ci'
          git config user.email 'step12-ci@users.noreply.github.com'
          git add src/execution_control/Executive.cpp
          git commit -m 'feat(step12): integrate Executive session/status sync [step12-integrated]'
          git push origin HEAD:step12-status-sync
