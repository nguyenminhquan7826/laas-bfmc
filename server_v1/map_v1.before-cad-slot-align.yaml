notes:
- The CAD PDF is the authoritative visual geometry source for map_v1.
- Physical map dimensions and manually measured parking geometry remain authoritative
  in meters.
- goal_pose remains unset until rear-axle-to-body geometry is physically verified.
- UNKNOWN must never be treated as FREE by the server slot selector.
- Do not use white paint markings themselves as collision obstacles; drivable-area
  semantics are classified separately.
source:
  type: autocad_vector_pdf
  file: map_source.pdf
  original_uploaded_name: Part2 (1).pdf
