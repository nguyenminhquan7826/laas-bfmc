    x_max: 580.76
    y_top: 219.8
    y_bottom: 791.48
  transform_pdf_to_map:
    scale_x_m_per_pt: 0.007885171854
    scale_y_m_per_pt: 0.007714105793
    x_formula: x_m = (x_pt - 14.0) * scale_x_m_per_pt
    y_formula: y_m = (791.48 - y_pt) * scale_y_m_per_pt
  note: X and Y are scaled independently to the physically measured map size.
  render_reference_file: map_reference.png
