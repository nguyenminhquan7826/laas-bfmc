notes:
- The CAD PDF is the authoritative visual geometry source for map_v1.
- For parking-slot geometry in planner tests, CAD paint-marking centerlines are authoritative because the uploaded PDF is the exact map.
- Previous manual parking dimensions are preserved under legacy_manual_parking_measurements for later physical cross-check.
- goal_pose remains unset until rear-axle-to-body geometry is physically verified.
- UNKNOWN must never be treated as FREE by the server slot selector.
- Do not use white paint markings themselves as collision obstacles; drivable-area semantics are classified separately.
- Hybrid A* V1 is constrained to drivable_areas[].planner_polygon_m for the current parking-sector test.
