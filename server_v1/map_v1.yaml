notes:
- The CAD PDF is the authoritative visual geometry source for map_v1.
- For parking-slot geometry in planner tests, CAD paint-marking centerlines are authoritative
  because the uploaded PDF is the exact map.
- Previous manual parking dimensions are preserved under legacy_manual_parking_measurements
  for later physical cross-check.
- goal_pose fields remain unset; slot_selector_v1 computes the exact rear-axle goal
  from the measured rear-axle-to-body-center offset.
- UNKNOWN must never be treated as FREE by the server slot selector.
- Do not use white paint markings themselves as collision obstacles; drivable-area
  semantics are classified separately.
- DRIVABLE_AREA V1 is active via drivable_grid_v1.json at 1 cm resolution; paint markings
  are traversable and outside-road regions are rejected.
source:
  type: autocad_vector_pdf
  file: map_source.pdf
  original_uploaded_name: Part2 (1).pdf
  page: 1
  geometry_file: map_lines_v1.json
  pdf_plot_extent_pt:
    x_min: 14.0
    x_max: 580.76
    y_top: 219.8
    y_bottom: 791.48
  transform_pdf_to_map:
    scale_x_m_per_pt: 0.007885171854
    scale_y_m_per_pt: 0.007714105793
    x_formula: x_m = (x_pt - 14.0) * scale_x_m_per_pt
    y_formula: y_m = (791.48 - y_pt) * scale_y_m_per_pt
  note: X and Y are scaled independently to the physically measured map size.
  render_reference_file: map_reference.png
geometry:
  visual_reference: EXTRACTED_FROM_CAD_VECTOR
  white_stroke_paths: map_lines_v1.json
  semantic_status: DRIVABLE_AREA_V1_ACTIVE
  planner_scope: FULL_MAP_FULL_FOOTPRINT_TEST
  markings_policy:
    crosswalk_stripes: MARKING_NOT_PHYSICAL_OBSTACLE
    dashed_center_lines: MARKING_NOT_PHYSICAL_OBSTACLE
    parking_bay_lines: MARKING_NOT_PHYSICAL_OBSTACLE
    solid_outer_road_edges: CANDIDATE_DRIVABLE_BOUNDARY
  render_reference: map_reference.png
validation:
  parking_reference_check:
    measured_left_offset_m: 1.719
    cad_reference_left_edge_m: 1.725906
    delta_left_m: 0.006906
    measured_bottom_offset_m: 0.228
    cad_reference_bottom_edge_m: 0.225869
    delta_bottom_m: -0.002131
    status: CONSISTENT_WITHIN_PLOT_LINE_EDGE_TOLERANCE
  cad_slot_alignment:
    method: average paired PDF vector edges to obtain paint-marking centerlines
    status: ACTIVE_FOR_OFFLINE_TEST
    manual_vs_cad_conflict: PRESENT
    note: Screenshot showed previous manual slot polygons were visibly narrower/shifted
      relative to CAD bays.
