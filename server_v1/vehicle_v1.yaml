schema_version: 1
vehicle_id: cybertruck_1_10_v1
units:
  distance: m
  angle: rad
geometry:
  reference_point: rear_axle_center
  length_m: 0.350
  width_m: 0.210
  wheelbase_m: 0.250
  track_width_m: 0.1615
  rear_overhang_m: 0.050
  front_overhang_m: 0.050
  # rear axle -> geometric body center along vehicle longitudinal axis.
  # length_m/2 - rear_overhang_m = 0.175 - 0.050 = 0.125 m
  body_center_from_rear_axle_m: 0.125
  # Physical body/wheelbase/overhang measurements have been supplied and
  # normalized from the reported 35/21/25/5/5 values as centimetres.
  footprint_verified: true
steering:
  # Physical servo command that produces the straightest front-wheel alignment.
  # Verified manually on the vehicle on 2026-09-06.
  servo_center_deg: 75.0
  # Verified usable servo command range. These are servo commands, NOT yet
  # physical front-wheel steering angles for the Hybrid A* bicycle model.
  servo_command_min_deg: 45.0
  servo_command_max_deg: 105.0
  software_limit_deg: 25.0
  thesis_measured_vehicle_angle_deg_at_servo_30: 22.84
  planner_max_steering_deg: null
motion:
  parking_nominal_speed_mps: 0.10
  direction_modes: [FORWARD, REVERSE]
verification_status:
  body_length:
    status: PHYSICALLY_MEASURED
    current_value_m: 0.350
  body_width:
    status: PHYSICALLY_MEASURED
    current_value_m: 0.210
  wheelbase:
    status: PHYSICALLY_MEASURED_LEFT_RIGHT_AGREE
    current_value_m: 0.250
    left_value_m: 0.250
    right_value_m: 0.250
    previous_software_baseline_m: 0.2515
    previous_conflicting_reported_value_m: 0.1895
  rear_overhang:
    status: PHYSICALLY_MEASURED
    current_value_m: 0.050
  front_overhang:
    status: PHYSICALLY_MEASURED
    current_value_m: 0.050
  steering_servo_center:
    status: PHYSICALLY_VERIFIED_STRAIGHT
    current_servo_command_deg: 75.0
    wheel_steering_angle_deg: 0.0
  steering_servo_command_range:
    status: PHYSICALLY_VERIFIED_COMMAND_LIMITS
    min_servo_command_deg: 45.0
    center_servo_command_deg: 75.0
    max_servo_command_deg: 105.0
    symmetric_about_center: true
    note: Physical front-wheel steering angles at these command limits are still TBD.
  planner_max_steering: TBD_MEASURE
  full_footprint:
    status: GEOMETRY_MEASURED_SOFTWARE_COLLISION_ENABLED
